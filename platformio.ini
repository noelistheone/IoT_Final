[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
platform_packages = platformio/tool-cmake@3.30.2
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.sdkconfig_defaults = sdkconfig.defaults
extra_scripts =
    pre:tools/prepare_firmware.py
    post:tools/native_fs.py
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -std=gnu++17
    -I include
    -I private
